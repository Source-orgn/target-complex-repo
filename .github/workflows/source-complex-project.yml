name: gitlab-source-group/Source-complex-project
on:
  push:
  workflow_dispatch:
concurrency:
  group: "${{ github.ref }}"
  cancel-in-progress: true
env:
  NETLIFY_AUTH_TOKEN: "${{ secrets.NETLIFY_AUTH_TOKEN }}"
jobs:
  build_website:
    runs-on: ubuntu-latest
    container:
      image: node:22-alpine
    timeout-minutes: 60
    env:
      NETLIFY_SITE_ID: 43c51581-4632-4204-bfe7-bffa061c508b
    steps:
    - uses: actions/checkout@v4.1.0
      with:
        fetch-depth: 20
        lfs: true
    - run: node --version
    - run: npm --version
    - run: ls -la
    - run: npm ci
    - run: npm run build
    - run: ls -la
    - uses: actions/upload-artifact@v4.1.0
      if: success()
      with:
        name: "${{ github.job }}"
        path: build/
  test_artifacts:
    needs: build_website
    runs-on: ubuntu-latest
    container:
      image: alpine
    timeout-minutes: 60
    env:
      NETLIFY_SITE_ID: 43c51581-4632-4204-bfe7-bffa061c508b
    steps:
    - uses: actions/checkout@v4.1.0
      with:
        fetch-depth: 20
        lfs: true
    - uses: actions/download-artifact@v4.1.0
    - run: test -f build/index.html
  unit_test:
    needs: build_website
    runs-on: ubuntu-latest
    container:
      image: node:22-alpine
    timeout-minutes: 60
    env:
      NETLIFY_SITE_ID: 43c51581-4632-4204-bfe7-bffa061c508b
    steps:
    - uses: actions/checkout@v4.1.0
      with:
        fetch-depth: 20
        lfs: true
    - uses: actions/download-artifact@v4.1.0
    - run: npm ci
    - run: npm test
#     # 'artifacts.junit' was not transformed because there is no suitable equivalent in GitHub Actions
  eslint:
    needs: build_website
    runs-on: ubuntu-latest
    container:
      image: node:22-alpine
    timeout-minutes: 60
    env:
      NETLIFY_SITE_ID: 43c51581-4632-4204-bfe7-bffa061c508b
    steps:
    - uses: actions/checkout@v4.1.0
      with:
        fetch-depth: 20
        lfs: true
    - uses: actions/download-artifact@v4.1.0
    - run: npm ci
    - run: npm run lint
#     # 'artifacts.codequality' was not transformed because there is no suitable equivalent in GitHub Actions
  netlify_stage:
    needs:
    - test_artifacts
    - unit_test
    - eslint
    runs-on: ubuntu-latest
    container:
      image: node:22-alpine
    if: ${{ github.ref }} == $CI_DEFAULT_BRANCH
    timeout-minutes: 60
    env:
      NETLIFY_SITE_ID: 43c51581-4632-4204-bfe7-bffa061c508b
    steps:
    - uses: actions/checkout@v4.1.0
      with:
        fetch-depth: 20
        lfs: true
    - uses: actions/download-artifact@v4.1.0
    - run: npm install -g netlify-cli@20.1.1
    - run: apk add curl
    - run: npm install -g netlify-cli@20.1.1
    - run: netlify --version
    - run: echo "Deploying to site id ${NETLIFY_SITE_ID}"
    - run: echo "NETLIFY_AUTH_TOKEN ${NETLIFY_AUTH_TOKEN}"
    - run: netlify deploy --alias staging --dir build
  netlify_prod:
    needs: netlify_stage
    runs-on: ubuntu-latest
    container:
      image: node:22-alpine
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    env:
      NETLIFY_SITE_ID: 43c51581-4632-4204-bfe7-bffa061c508b
    steps:
    - uses: actions/checkout@v4.1.0
      with:
        fetch-depth: 20
        lfs: true
    - uses: actions/download-artifact@v4.1.0
    - run: npm install -g netlify-cli@20.1.1
    - run: apk add curl
    - run: npm install -g netlify-cli@20.1.1
    - run: netlify --version
    - run: echo "Deploying to site id ${NETLIFY_SITE_ID}"
    - run: echo "NETLIFY_AUTH_TOKEN ${NETLIFY_AUTH_TOKEN}"
    - run: netlify deploy --prod --dir build
